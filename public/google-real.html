<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🅖 Google 真题刷题库 · hellointerview</title>
<meta name="description" content="hellointerview 真实 Google CODING 题 152 道,按 report 频率排序,分类 + 中英 + 完整代码 + 复杂度 + follow-up">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  background: #0f172a; color: #e2e8f0; line-height: 1.55; }
a { color: inherit; text-decoration: none; }

/* layout */
.layout { display: flex; min-height: 100vh; }
.sidebar { width: 230px; background: #111a2e; border-right: 1px solid #1e293b;
  position: fixed; top: 0; bottom: 0; left: 0; overflow-y: auto; padding: 16px 0; z-index: 50; }
.main { margin-left: 230px; flex: 1; padding: 20px 26px 60px; max-width: 920px; }

/* sidebar */
.brand { font-size: 15px; font-weight: 700; padding: 0 18px 12px; color: #f1f5f9; }
.brand small { display:block; font-size: 10.5px; color:#64748b; font-weight: 400; margin-top: 2px; }
.side-search { margin: 0 12px 12px; }
.side-search input { width: 100%; padding: 8px 12px; font-size: 13px; background: #1e293b;
  border: 1px solid #334155; border-radius: 8px; color: #f1f5f9; outline: none; }
.side-search input:focus { border-color: #6366f1; }
.cat-item { display: flex; justify-content: space-between; align-items: center;
  padding: 8px 18px; font-size: 13.5px; cursor: pointer; color: #cbd5e1; border-left: 3px solid transparent; }
.cat-item:hover { background: #1e293b; }
.cat-item.active { background: #1e293b; border-left-color: #6366f1; color: #fff; font-weight: 600; }
.cat-item .n { font-size: 11px; color: #64748b; background:#0f172a; padding: 1px 7px; border-radius: 10px; }
.cat-item.active .n { color:#a5b4fc; }

/* main */
.page-title { font-size: 20px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
.page-sub { font-size: 12.5px; color: #94a3b8; margin-bottom: 16px; }
.overview { background: rgba(99,102,241,0.1); border-left: 3px solid #6366f1;
  padding: 10px 14px; font-size: 13px; color: #cbd5e1; border-radius: 0 6px 6px 0; margin-bottom: 18px; }

/* question list */
.qcard { background: #1e293b; border: 1px solid #334155; border-radius: 10px;
  padding: 12px 16px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.15s; }
.qcard:hover { border-color: #6366f1; }
.qcard .row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rep { font-size: 11px; font-weight: 700; color: #fff; background: linear-gradient(135deg,#f59e0b,#ef4444);
  padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.rep.low { background: #334155; color: #94a3b8; }
.qtitle { font-size: 14px; font-weight: 600; color: #f1f5f9; }
.qcn { font-size: 12.5px; color: #94a3b8; }
.diff { font-size: 10px; color: #64748b; }
.has-sol { font-size: 10px; color: #34d399; }
.no-sol { font-size: 10px; color: #fbbf24; }

/* detail */
.back { font-size: 13px; color: #60a5fa; cursor: pointer; margin-bottom: 14px; display: inline-block; }
.detail-title { font-size: 19px; font-weight: 700; color: #f1f5f9; }
.detail-cn { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.badge { font-size: 11px; padding: 2px 9px; border-radius: 10px; background: #1e293b; border: 1px solid #334155; color: #cbd5e1; }
.sec-h { font-size: 13px; font-weight: 700; color: #a5b4fc; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.desc-box { background:#1e293b; border:1px solid #334155; border-radius:8px; padding:10px 14px; font-size:13px; color:#cbd5e1; }
.approach-box { background: rgba(52,211,153,0.08); border-left:3px solid #34d399; padding:8px 12px; font-size:13px; color:#cbd5e1; border-radius:0 6px 6px 0; }
.fu-box { background: rgba(251,191,36,0.08); border-left:3px solid #f59e0b; padding:8px 12px; font-size:13px; color:#cbd5e1; border-radius:0 6px 6px 0; }
.cx { font-size:12.5px; color:#fbbf24; font-weight:600; background:rgba(251,191,36,0.1); padding:4px 12px; border-radius:6px; display:inline-block; margin: 2px 0; }
pre { background:#0b1120; color:#e2e8f0; padding:14px 16px; border-radius:8px; overflow-x:auto;
  font-size:13px; line-height:1.55; font-family:"SF Mono",Menlo,Consolas,monospace; border:1px solid #1e293b; margin: 6px 0; }
.kw { color:#f472b6; } .cm { color:#64748b; font-style:italic; }
.pending { color:#fbbf24; font-size:13px; padding: 14px; background:#1e293b; border-radius:8px; border:1px dashed #475569; }
/* 进度条 + 勾选 */
.progress-wrap { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:12px 16px; margin-bottom:16px; }
.progress-top { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#cbd5e1; margin-bottom:8px; }
.progress-top b { color:#34d399; }
.progress-bar { height:8px; background:#0b1120; border-radius:6px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,#34d399,#10b981); transition:width 0.3s; }
.chk { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; min-width:22px;
  border:2px solid #475569; border-radius:6px; color:transparent; font-size:13px; font-weight:700; cursor:pointer; user-select:none; transition:all 0.15s; }
.chk:hover { border-color:#34d399; }
.chk.on { background:#10b981; border-color:#10b981; color:#fff; }
.qcard.done { opacity:0.55; }
.qcard.done .qtitle { text-decoration:line-through; }
.done-btn { display:inline-block; padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid #334155; background:#1e293b; color:#cbd5e1; margin-bottom:14px; }
.done-btn.on { background:#10b981; border-color:#10b981; color:#fff; }
.reset-link { font-size:11px; color:#64748b; cursor:pointer; }
.reset-link:hover { color:#ef4444; }
.toolbar { display:flex; align-items:center; gap:16px; margin-bottom:12px; flex-wrap:wrap; }
.hide-toggle { font-size:13px; color:#cbd5e1; cursor:pointer; display:flex; align-items:center; gap:6px; user-select:none; }
.hide-toggle input { cursor:pointer; }
.export-btn { font-size:13px; color:#34d399; cursor:pointer; border:1px solid #334155; padding:4px 12px; border-radius:8px; background:#1e293b; }
.export-btn:hover { border-color:#34d399; }
.ex-box { background:rgba(52,211,153,0.08); border-left:3px solid #34d399; border-radius:8px; padding:12px 14px;
  margin-bottom:14px; white-space:pre-wrap; font-size:14px; line-height:1.7; color:#d1fae5; font-family:'SF Mono',Menlo,monospace; }
.edge-box { background:rgba(251,146,60,0.08); border-left:3px solid #fb923c; border-radius:8px; padding:12px 14px;
  margin-bottom:14px; white-space:pre-wrap; font-size:13.5px; line-height:1.8; color:#fed7aa; }
.note-box { width:100%; min-height:90px; box-sizing:border-box; background:#0f172a; border:1px solid #334155; border-radius:10px;
  color:#e2e8f0; font-size:14px; padding:12px; resize:vertical; font-family:inherit; line-height:1.6; margin-bottom:14px; }
.note-box:focus { outline:none; border-color:#6366f1; }

/* mobile */
.menu-btn { display:none; position:fixed; top:10px; left:10px; z-index:60; background:#6366f1; color:#fff;
  border:none; padding:8px 12px; border-radius:8px; font-size:14px; cursor:pointer; }
@media (max-width: 760px) {
  .sidebar { transform: translateX(-100%); transition: transform 0.2s; width: 220px; }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; padding: 56px 16px 60px; }
  .menu-btn { display: block; }
}
footer { color:#475569; font-size:11px; text-align:center; margin-top:30px; }
footer a { color:#64748b; }
</style>
</head>
<body>
<button class="menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰ 分类</button>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">🅖 Google 真题库<small>hellointerview · 152 题 · 按 report 排序</small></div>
    <div class="side-search"><input id="search" placeholder="🔍 搜题号/题名/中文" autocomplete="off"></div>
    <div id="catlist"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script src="gq-data.js?v=ex-edge"></script>
<script>
const GQ = window.GQ, CATS = window.CATS;
// count per category
const counts = {}; GQ.forEach(q => counts[q.cat] = (counts[q.cat]||0)+1);
const catMap = {}; CATS.forEach(c => catMap[c.id]=c.name);
// only show cats that have questions, ordered by CATS order
const cats = CATS.filter(c => counts[c.id]);
const totalSol = GQ.filter(q=>q.sol).length;
const mustCount = GQ.filter(q=>q.must).length;

// sidebar
const catlist = document.getElementById('catlist');
function renderSidebar(active){
  let h = `<div class="cat-item ${active==='must'?'active':''}" data-cat="must" style="background:rgba(251,191,36,0.12);border-left-color:${active==='must'?'#fbbf24':'transparent'};color:#fbbf24;font-weight:600">⭐ 冲刺必看 <span class="n" style="background:rgba(251,191,36,0.2);color:#fbbf24">${mustCount}</span></div>`;
  // 3天刷题计划
  const dayColors = {day1:'#34d399',day2:'#60a5fa',day3:'#f472b6'};
  ['day1','day2','day3'].forEach((d,i)=>{
    const c = dayColors[d], n = GQ.filter(q=>q.day===i+1).length;
    h += `<div class="cat-item ${active===d?'active':''}" data-cat="${d}" style="background:${active===d?'rgba(255,255,255,0.04)':'transparent'};border-left-color:${active===d?c:'transparent'};color:${c};font-weight:600">📅 Day ${i+1} <span class="n" style="background:rgba(255,255,255,0.08);color:${c}">${n}</span></div>`;
  });
  h += `<div class="cat-item ${active==='all'?'active':''}" data-cat="all" style="margin-top:6px">全部 <span class="n">${GQ.length}</span></div>`;
  cats.forEach(c => {
    h += `<div class="cat-item ${active===c.id?'active':''}" data-cat="${c.id}">${c.name} <span class="n">${counts[c.id]}</span></div>`;
  });
  catlist.innerHTML = h;
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(code){
  let h = esc(code);
  h = h.replace(/(#[^\n]*)/g, '<span class="cm">$1</span>');
  h = h.replace(/(<span class="cm">[^<]*<\/span>)|(\b(?:class|def|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|import|from|break|continue|lambda|del|nonlocal|with|as|yield|raise|global)\b)/g,
    (m,cmt,kw)=> cmt?cmt:'<span class="kw">'+kw+'</span>');
  return h;
}

const main = document.getElementById('main');
let curCat = 'all', curSearch = '';

// 已掌握状态(localStorage 持久化)
let done = new Set(JSON.parse(localStorage.getItem('gq_done')||'[]'));
function saveDone(){ localStorage.setItem('gq_done', JSON.stringify([...done])); }
function toggleDone(id){ if(done.has(id)) done.delete(id); else done.add(id); saveDone(); }
function resetDone(){ if(confirm('确定清空所有「已掌握」记录?')){ done = new Set(); saveDone(); renderList(); } }

// 备注(localStorage 持久化)
let notes = JSON.parse(localStorage.getItem('gq_notes')||'{}');
function saveNote(id, val){ if(val&&val.trim()){ notes[id]=val; } else { delete notes[id]; } localStorage.setItem('gq_notes', JSON.stringify(notes)); }
function exportNotes(){
  const ids = Object.keys(notes);
  let md = `# Google 刷题备注导出\n\n生成时间: ${new Date().toLocaleString('zh-CN')}\n已掌握: ${done.size} 题 · 有备注: ${ids.length} 题\n\n`;
  // 按 Day 分组导出
  [1,2,3].forEach(d=>{
    const qs = GQ.filter(q=>q.day===d);
    md += `\n## 📅 Day ${d}\n\n`;
    qs.forEach(q=>{
      const dn = done.has(q.id)?'✅':'⬜';
      const nt = notes[q.id];
      md += `- ${dn} **${q.en}** (${q.cn})\n`;
      if(nt) md += nt.split('\n').map(l=>'    > '+l).join('\n')+'\n';
    });
  });
  // 非计划内但有备注的
  const extra = ids.filter(id=>{ const q=GQ.find(x=>x.id===id); return q && !q.day; });
  if(extra.length){ md += `\n## 其它\n\n`; extra.forEach(id=>{ const q=GQ.find(x=>x.id===id); md += `- **${q.en}** (${q.cn})\n${notes[id].split('\n').map(l=>'    > '+l).join('\n')}\n`; }); }
  const blob = new Blob([md], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `google刷题备注_${new Date().toISOString().slice(0,10)}.md`;
  a.click(); URL.revokeObjectURL(a.href);
}

function repBadge(r){
  return `<span class="rep ${r<2?'low':''}">🔥 ${r}</span>`;
}
function progressBar(list){
  const total = list.length, d = list.filter(q=>done.has(q.id)).length;
  const pct = total? Math.round(d/total*100):0;
  return `<div class="progress-wrap">
    <div class="progress-top"><span>📊 进度 <b>${d}</b> / ${total} 已掌握 (${pct}%)</span><span class="reset-link" onclick="resetDone()">清空记录</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>`;
}

let hideDone = localStorage.getItem('gq_hidedone')==='1';
function toggleHideDone(){ hideDone=!hideDone; localStorage.setItem('gq_hidedone', hideDone?'1':'0'); renderList(); }
const dayInfo = {
  day1:{name:'📅 Day 1 · 线性结构打底', color:'#34d399', desc:'数组 → 字符串 → 栈 → 二分 → 堆 → 树。都是范式短题,过得快、建手感。'},
  day2:{name:'📅 Day 2 · 区间 + 搜索/回溯', color:'#60a5fa', desc:'区间扫描线 → DFS/岛屿/回溯 → 并查集 → Trie → 贪心。需要画图想清楚。'},
  day3:{name:'📅 Day 3 · 图论 + 设计', color:'#f472b6', desc:'BFS/拓扑/最短路 → 设计/OOP。最硬核,建议先看💡思路再自己写。'},
};
function renderList(){
  let list = GQ.slice();
  if(curCat==='must') list = list.filter(q=>q.must);
  else if(curCat.startsWith('day')) list = list.filter(q=>q.day===+curCat.slice(3));
  else if(curCat!=='all') list = list.filter(q=>q.cat===curCat);
  if(curSearch){
    const ql = curSearch.toLowerCase();
    list = list.filter(q => (q.en+' '+q.cn+' '+(q.id||'')).toLowerCase().includes(ql));
  }
  if(hideDone) list = list.filter(q=>!done.has(q.id));
  // day 视图按计划内顺序;其余按频率
  if(curCat.startsWith('day')) list.sort((a,b)=> b.reports-a.reports || a.en.localeCompare(b.en));
  else list.sort((a,b)=> b.reports-a.reports || a.en.localeCompare(b.en));
  const di = dayInfo[curCat];
  const catName = di ? di.name : (curCat==='must' ? '⭐ 冲刺必看 50 题' : (curCat==='all' ? '全部题目' : catMap[curCat]));
  let h = `<div class="page-title">${catName} <span style="font-size:13px;color:#64748b">· ${list.length} 题</span></div>`;
  h += `<div class="page-sub">数字=该题在 hellointerview 被报告的次数(频率)。共 ${GQ.length} 题全部配齐完整解答 + 带代码 follow-up。</div>`;
  if(di){
    h += `<div class="overview" style="background:rgba(255,255,255,0.03);border-left-color:${di.color}">${di.desc} 勾选「✓」标记已掌握,可点上方「隐藏已掌握」把做过的折叠掉。</div>`;
  } else if(curCat==='must'){
    h += `<div class="overview" style="background:rgba(251,191,36,0.1);border-left-color:#fbbf24">⭐ <b>冲刺必看 50 题</b> · 结合真题频率 + L5 FDE 判断挑出(已剔除全部 DP),按 Day1/2/3 三天计划安排。涵盖各大类代表题。</div>`;
  } else if(curCat!=='all'){
    h += `<div class="overview">📂 <b>${catName}</b> · 这一类共 ${counts[curCat]} 道真题。点任意题进详情(中英题面 + 带注释代码 + 复杂度 + 带代码 follow-up)。建议从 🔥 高频往低刷。</div>`;
  }
  h += `<div class="toolbar"><label class="hide-toggle"><input type="checkbox" ${hideDone?'checked':''} onchange="toggleHideDone()"> 隐藏已掌握</label><span class="export-btn" onclick="exportNotes()">⬇️ 导出备注</span></div>`;
  h += progressBar(list);
  if(list.length===0){ h += '<div class="pending">没找到匹配的题。</div>'; main.innerHTML=h; return; }
  list.forEach((q,i)=>{
    const gi = GQ.indexOf(q);
    const isDone = done.has(q.id);
    h += `<div class="qcard ${isDone?'done':''}" data-i="${gi}" ${q.must?'style="border-color:rgba(251,191,36,0.4)"':''}>
      <div class="row1"><span class="chk ${isDone?'on':''}" data-chk="${q.id}" title="标记已掌握">✓</span>${repBadge(q.reports)}${q.must?'<span style="font-size:11px;color:#fbbf24;font-weight:700">⭐必看</span>':''}<span class="qtitle">${esc(q.en)}</span><span class="qcn">${esc(q.cn)}</span></div>
      <div style="margin-top:4px;padding-left:30px"><span class="diff">${esc(q.level||'')}</span> · <span class="badge" style="font-size:9px;padding:1px 6px">${catMap[q.cat]}</span> <span class="has-sol">✓ 完整解答+注释</span></div>
    </div>`;
  });
  main.innerHTML = h;
  window.scrollTo(0,0);
}

function renderDetail(idx){
  const q = GQ[idx];
  location.hash = 'q=' + q.id;
  let h = `<span class="back" onclick="goList()">← 返回列表</span>`;
  h += `<div class="detail-title">${esc(q.en)}</div>`;
  h += `<div class="detail-cn">${esc(q.cn)}</div>`;
  h += `<div class="badges">${repBadge(q.reports)}${q.must?'<span class="badge" style="background:rgba(251,191,36,0.2);color:#fbbf24;border-color:#fbbf24">⭐ 冲刺必看</span>':''}<span class="badge">${catMap[q.cat]}</span><span class="badge">${esc(q.level||'')}</span><span class="badge">最近: ${esc(q.last||'')}</span></div>`;
  h += `<div class="done-btn ${done.has(q.id)?'on':''}" data-doneid="${q.id}" data-idx="${idx}">${done.has(q.id)?'✓ 已掌握 (点击取消)':'○ 标记已掌握'}</div>`;
  // 备注
  h += `<div class="sec-h">📝 我的备注 <span style="font-size:11px;color:#64748b;font-weight:400">(自动保存,可在列表页「导出备注」)</span></div>`;
  h += `<textarea class="note-box" data-noteid="${q.id}" placeholder="写下你的思路卡点 / 易错点 / 复盘…">${esc(notes[q.id]||'')}</textarea>`;
  // 题面
  h += `<div class="sec-h">📋 题目 (EN)</div><div class="desc-box">${esc(q.desc||'(无描述)')}</div>`;
  if(q.ex) h += `<div class="sec-h">📥 示例</div><div class="ex-box">${esc(q.ex)}</div>`;
  if(q.edge) h += `<div class="sec-h">⚠️ 边界 &amp; 易错</div><div class="edge-box">${esc(q.edge)}</div>`;
  if(q.sol){
    h += `<div class="sec-h">💡 思路</div><div class="approach-box">${esc(q.sol.ap)}</div>`;
    h += `<div class="sec-h">💻 完整代码</div><pre>${hl(q.sol.code)}</pre>`;
    h += `<div class="sec-h">⏱️ 复杂度</div><div><span class="cx">时间 ${esc(q.sol.t)}</span> &nbsp; <span class="cx">空间 ${esc(q.sol.s)}</span></div>`;
    const fus = q.sol.fus || [];
    if(fus.length){
      h += `<div class="sec-h">🔁 Follow-up · ${fus.length} 个 (每个都有代码)</div>`;
      fus.forEach((f,fi)=>{
        h += `<div class="fu-box"><b>Q${fi+1}: ${esc(f.q)}</b>${f.ap?'<br>'+esc(f.ap):''}</div>`;
        if(f.code) h += `<pre>${hl(f.code)}</pre>`;
        if(f.t||f.s) h += `<div style="margin-bottom:10px"><span class="cx">时间 ${esc(f.t||'-')}</span> &nbsp; <span class="cx">空间 ${esc(f.s||'-')}</span></div>`;
      });
    } else if(q.sol.fu){
      h += `<div class="sec-h">🔁 Follow-up</div><div class="fu-box">${esc(q.sol.fu)}</div>`;
    }
  } else {
    h += `<div class="sec-h">💡 解答</div><div class="pending">○ 这道题的完整解答正在整理中。题面见上方;它属于「${catMap[q.cat]}」类,可参考同类已配解答的题目套路。</div>`;
  }
  main.innerHTML = h;
  window.scrollTo(0,0);
}

function goList(){ location.hash = curCat==='all'?'':('cat='+curCat); renderList(); }

// events
catlist.addEventListener('click', e=>{
  const it = e.target.closest('.cat-item'); if(!it) return;
  curCat = it.dataset.cat; renderSidebar(curCat); renderList();
  document.querySelector('.sidebar').classList.remove('open');
});
main.addEventListener('click', e=>{
  const dbtn = e.target.closest('[data-doneid]');
  if(dbtn){ toggleDone(dbtn.dataset.doneid); renderDetail(parseInt(dbtn.dataset.idx)); return; }
  const chk = e.target.closest('[data-chk]');
  if(chk){ e.stopPropagation(); toggleDone(chk.dataset.chk); renderList(); return; }
  const card = e.target.closest('.qcard'); if(!card) return;
  renderDetail(parseInt(card.dataset.i));
});
main.addEventListener('input', e=>{
  const ta = e.target.closest('[data-noteid]');
  if(ta) saveNote(ta.dataset.noteid, ta.value);
});
document.getElementById('search').addEventListener('input', e=>{
  curSearch = e.target.value.trim(); curCat = curCat==='all'?'all':curCat; renderList();
});

function initFromHash(){
  const h = location.hash.slice(1);
  if(h.startsWith('q=')){
    const id = h.slice(2);
    const idx = GQ.findIndex(q=>q.id===id);
    if(idx>=0){ renderSidebar('all'); renderDetail(idx); return; }
  }
  if(h.startsWith('cat=')){
    curCat = h.slice(4);
  }
  renderSidebar(curCat); renderList();
}
initFromHash();
